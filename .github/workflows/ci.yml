name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  case-audit:
    # Catches case-mismatched relative imports that work on Windows/macOS but break on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit import casing
        run: node deploy/audit-case.mjs .

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Syntax check all sources
        run: node --check server.js && find . -path ./node_modules -prune -o -name '*.js' -print -exec node --check {} +

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Production build (verifies Linux build + prerender)
        run: npm run build
